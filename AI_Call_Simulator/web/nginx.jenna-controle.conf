server {
    listen 80;
    server_name jenna-controle.com www.jenna-controle.com;

    root /var/www/ai-call-simulator;
    index simulation.html;

    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /simulation.html;
    }

    # API MySQL — conversation_api.py (port 8766)
    location /conv-api/ {
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Voix prospect — tts_server.py (port 8765) — optionnel
    location /tts/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
