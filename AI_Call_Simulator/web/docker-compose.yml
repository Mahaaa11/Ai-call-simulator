services:
  mysql:
    image: mysql:8.4
    container_name: call_simulator_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: call_simulator
      MYSQL_DATABASE: call_simulator
    volumes:
      - call_simulator_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcall_simulator"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  call_simulator_mysql_data:
