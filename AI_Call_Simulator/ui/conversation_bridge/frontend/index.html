<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/streamlit-component-lib@1.0.0/dist/index.js"></script>
</head>
<body>
<script>
  function attachListener() {
    const target = window.parent;
    if (!target || target.__simSaveBridgeAttached) return;
    target.__simSaveBridgeAttached = true;
    target.addEventListener("message", function (event) {
      const data = event.data || {};
      if (!window.Streamlit) return;
      if (data.type === "SAVE_CONVERSATION" && data.payload) {
        Streamlit.setComponentValue({ action: "save", payload: data.payload });
        return;
      }
      if (data.type === "UPDATE_CONVERSATION_EVAL" && data.conversation_id) {
        Streamlit.setComponentValue({
          action: "update_eval",
          conversation_id: data.conversation_id,
          evaluation: data.evaluation || {},
        });
      }
    });
    if (window.Streamlit) {
      Streamlit.setFrameHeight(0);
    }
  }
  attachListener();
  setTimeout(attachListener, 500);
</script>
</body>
</html>
